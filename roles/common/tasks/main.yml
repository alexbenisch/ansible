---
- name: Update apt cache and upgrade packages
  apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - curl
      - vim
      - htop
      - ufw
    state: present

- name: Enable and configure UFW
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH
  ufw:
    rule: allow
    port: "22"
    proto: tcp
